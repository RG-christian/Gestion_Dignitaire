services:
  db:
    image: mysql:8.0
    container_name: gestion-dignitaire-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gestion_dignitaire
      MYSQL_USER: gestion
      MYSQL_PASSWORD: gestion_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - gestion_dignitaire_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: gestion-dignitaire-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_dignitaire
      DB_USERNAME: gestion
      DB_PASSWORD: gestion_password
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
      MAIL_FROM_ADDRESS: notifications@dignitaires.ga
      MAIL_FROM_NAME: Gestion Dignitaire
    ports:
      - "8000:80"
    volumes:
      - ./backend/storage:/var/www/html/storage

  queue:
    build: ./backend
    container_name: gestion-dignitaire-queue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_dignitaire
      DB_USERNAME: gestion
      DB_PASSWORD: gestion_password
      QUEUE_CONNECTION: database
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend/storage:/var/www/html/storage

  scheduler:
    build: ./backend
    container_name: gestion-dignitaire-scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_dignitaire
      DB_USERNAME: gestion
      DB_PASSWORD: gestion_password
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    volumes:
      - ./backend/storage:/var/www/html/storage

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    container_name: gestion-dignitaire-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports:
      - "3002:3000"

  mailpit:
    image: axllent/mailpit:latest
    container_name: gestion-dignitaire-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  gestion_dignitaire_db:
